[main]
font=Noto Sans:size=12
use-bold=yes
icon-theme=breeze-dark
prompt=">    "
placeholder=Поиск приложений…
width=42
lines=12
horizontal-pad=22
vertical-pad=10
inner-pad=7
line-height=24
match-mode=fzf
show-actions=yes
filter-desktop=yes
match-counter=yes
layer=overlay
dpi-aware=auto

[colors]
background=1e1e2edd
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

[border]
width=1
radius=7
selection-radius=7
