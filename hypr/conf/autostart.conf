# ============================================================
#  Autostart — desktop components
#  (exec-once runs at session start, not on reload)
# ============================================================

# ---- Desktop UI ----
exec-once = waybar
exec-once = swaync

# ---- Authentication ----
exec-once = env QT_QPA_PLATFORMTHEME=qt6ct /usr/lib/hyprpolkitagent/hyprpolkitagent

# ---- Idle / lock ----
exec-once = hypridle

# ---- Clipboard history ----
exec-once = wl-paste --watch cliphist store

# ---- Wallpaper ----
exec-once = awww-daemon
exec-once = wallpaper.sh --restore

# ---- KDE Connect indicator ----
exec-once = kdeconnect-indicator
