# ============================================================
#  Workspaces — fixed layout on both monitors
# ============================================================
# Dedicated gaming workspace on the primary monitor
workspace = name:gaming, monitor:DP-1, default:true

# Persistent workspaces: 1 and 3 on DP-1, 2 on DP-2
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-2, default:true, persistent:true
workspace = 3, monitor:DP-1, default:true, persistent:true