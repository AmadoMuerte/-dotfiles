# ============================================================
#  Keybindings — preserved 1:1 from the previous user config
# ============================================================
$mainMod = SUPER

# ---- Window management ----------------------------------------
bind = $mainMod, T,           exec, uwsm app -- $terminal          # terminal
bind = $mainMod, Q,           killactive                            # close window
bind = $mainMod SHIFT, Q,     exec, hyprctl dispatch closewindow    # close window (alt)
bind = $mainMod, W,           fullscreen, 1                         # fullscreen
bind = $mainMod SHIFT, F,     exec, hyprctl dispatch togglefloating active && hyprctl dispatch pin active && hyprctl dispatch global active
bind = $mainMod, F,           togglefloating                        # float toggle
bind = $mainMod ALT, F,       exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod, V,           togglefloating                        # float toggle
bind = $mainMod, J,           layoutmsg, togglesplit                # dwindle split

# ---- Exit ------------------------------------------------------
bind = CTRL ALT, Delete,      exec, hyprctl dispatch exit 0
bind = $mainMod SHIFT, M,     exec, hyprctl dispatch exit 0

# ---- Focus movement --------------------------------------------
bind = $mainMod, Left,  movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up,    movefocus, u
bind = $mainMod, Down,  movefocus, d

# ---- Move window ------------------------------------------------
bind = $mainMod CTRL, Left,  movewindow, l
bind = $mainMod CTRL, Right, movewindow, r
bind = $mainMod CTRL, Up,    movewindow, u
bind = $mainMod CTRL, Down,  movewindow, d

# ---- Resize window (hold to repeat) -----------------------------
binde = $mainMod SHIFT, Left,  resizeactive, -100 0
binde = $mainMod SHIFT, Right, resizeactive, 100 0
binde = $mainMod SHIFT, Up,    resizeactive, 0 -100
binde = $mainMod SHIFT, Down,  resizeactive, 0 100

# ---- Mouse drag (move / resize windows) ------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---- Applications ------------------------------------------------
bind = $mainMod, E, exec, uwsm app -- $fileManager                  # file manager
bind = $mainMod, A, exec, $menu                                     # launcher

# ---- Screenshot (region -> swappy editor) -------------------------
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# ---- Lock ---------------------------------------------------------
bind = $mainMod, L, exec, hyprlock                                   # lock screen

# ---- Wallpaper picker ---------------------------------------------
bind = $mainMod SHIFT, W, exec, wallpaper.sh --picker               # choose wallpaper (applies + regenerates theme)

# ---- Clipboard history (fuzzel picker) -----------------------------
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu -p "Clipboard: " | cliphist decode | wl-copy

# ---- Hardware keys (hold to repeat) --------------------------------
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind  = , XF86AudioMute,        exec, pamixer -t
bind  = , XF86AudioMicMute,     exec, pamixer --default-source -t
binde = , XF86MonBrightnessUp,  exec, brightnessctl set 10%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ---- Workspaces ----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces (relative to current monitor)
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up,   workspace, m-1

# ---- Touchpad gestures (1:1 from previous setup) -------------------
gesture = 4, horizontal, workspace
gesture = 3, down, close
gesture = 3, up, fullscreen
gesture = 3, left, float