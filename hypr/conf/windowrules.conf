# ============================================================
#  Window rules — ported from the previous setup
#  Syntax: windowrule = match:PROP value, EFFECT value
# ============================================================

# ---- Generic -------------------------------------------------
# Remember float size between launches
windowrule = persistent_size true, match:float 1

# ---- Picture-in-Picture ---------------------------------------
windowrule = match:title ^([Pp]icture[ -]?[Ii]n[ -]?[Pp]icture)(.*)$, float true, keep_aspect_ratio true, pin true, size monitor_w*0.25 monitor_h*0.25

# ---- Gaming (Steam / Proton / gamescope) -----------------------
# Games go to the dedicated "gaming" workspace, borderless
# fullscreen, undecorated. Preserved from the previous setup.
windowrule = workspace name:gaming, match:content 3
windowrule = workspace name:gaming, fullscreen_state 2, content game, sync_fullscreen true, match:xdg_tag ^(.*game.*)$
windowrule = workspace name:gaming, match:class ^(steam_app.*|gamescope)$

windowrule = match:class ^(steam)$, match:title ^(Friends List)$, float true
windowrule = match:class ^(steam)$, match:title ^(Launching\.{3})$, float true, center true, workspace name:gaming

windowrule = match:class ^(steam_app.*|gamescope)$, match:title ^(.+)$, match:initial_title negative:^(.*[/]home[/].*)$, content game, decorate false, fullscreen_state 2, size monitor_w monitor_h, sync_fullscreen true

windowrule = match:class ^(steam_app.*)$, match:initial_title ^$, float true, center true, fullscreen false, fullscreen_state 0, workspace name:gaming

# ---- Applications ----------------------------------------------
windowrule = match:class ^(.*\.exe)$, match:float 1, center true, fullscreen_state 0, monitor DP-1
windowrule = match:class ^(.*[Ll]auncher.*)$, float true, monitor DP-1
windowrule = match:class ^(vesktop|discord)$, monitor DP-1
windowrule = match:class ^(.*[Cc]alc.*)$, float true, size monitor_w*0.17 monitor_h*0.43
windowrule = match:class ^(org\.kde\.keditfiletype)$, float true
windowrule = match:class ^(org\.kde\.ark)$, size monitor_w*0.40 monitor_h*0.40

# v2rayN to its own silent workspace (user rule)
windowrule = workspace 5 silent, match:class ^v2rayN$, match:initial_class ^v2rayN$

# File manager dialogs float centered (user rule, dolphin+nautilus)
windowrule = match:class ^(org\.kde\.dolphin|org\.gnome\.Nautilus)$, match:title negative:^(Moving.*|Create New.*|Extract.*|Compress.*|Copying.*|Progress.*|Configure.*|Properties.*|Choose[ ]Application.*)$, float true, center true, size monitor_w*0.50 monitor_h*0.55

# ---- Opacity overrides -----------------------------------------
windowrule = opacity 1.0 override, match:class ^(firefox|zen)$
windowrule = opacity 1.0 override, match:class ^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$
windowrule = opacity 1.0 override, match:class ^(mpv|org.kde.haruna|.*plex.*|org\.kde\.gwenview|.*vlc.*)$

# ---- Floating utility windows -----------------------------------
windowrule = match:class ^(kvantummanager|qt[56]ct|nwg-look)$, float true
windowrule = match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-applet|nm-connection-editor)$, float true
windowrule = match:title ^(Winetricks.*|Protontricks.*)$, float true

# ---- Common modals / file pickers --------------------------------
windowrule = match:title ^(Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress)$, float true
windowrule = match:initial_title ^(Open File)$, float true
windowrule = match:class ^([Xx]dg-desktop-portal-gtk)$, float true
windowrule = match:title ^(File Upload|Choose wallpaper|Library)(.*)$, float true
windowrule = match:class ^(.*dialog.*)$, float true
windowrule = match:title ^(.*dialog.*)$, float true
windowrule = match:class ^(hyprland-share-picker)$, float true

# ---- Idle inhibition ---------------------------------------------
# Fullscreen windows (games, video) keep the screen awake
# (protects from hypridle locking during games).
windowrule = idle_inhibit fullscreen, match:class .*

# ---- Ignore maximize requests (keeps tiling predictable) ---------
windowrule = suppress_event maximize, match:class .*

# ---- Fix XWayland drag issues ------------------------------------
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
