# ============================================================
#  Animations — curves and animation speeds
#  (ported from the previous setup, native .conf syntax)
# ============================================================
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = overshoot, 0.5, 0.9, 0.1, 1.1

animation = global, 1, 3, quick
animation = windows, 1, 3, quick, slide
animation = workspaces, 1, 5, quick, slide
animation = specialWorkspaceIn, 1, 2, quick, slidevert
animation = specialWorkspaceOut, 1, 2, quick, slidevert