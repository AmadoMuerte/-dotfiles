# ============================================================
#  Hyprland — main configuration (user-owned, standalone)
#  No Lua, no Noctalia, no CachyOS dotfiles.
#
#  Structure:
#    colors.conf            — palette (regenerated by matugen)
#    conf/monitors.conf     — monitors (managed by nwg-displays)
#    conf/input.conf        — keyboard / mouse
#    conf/appearance.conf   — gaps, borders, blur, opacity
#    conf/animations.conf   — curves and animations
#    conf/binds.conf        — all keybindings
#    conf/windowrules.conf  — window rules
#    conf/workspaces.conf   — workspace rules
#    conf/autostart.conf    — startup applications
# ============================================================

# ---- Applications (change once here) ------------------------
$terminal    = ghostty
$fileManager = nautilus
$browser     = zen-browser
$editor      = gnome-text-editor --new-window
$menu        = fuzzel

# ---- Palette (generated by matugen from the wallpaper) ------
source = colors.conf

# ---- Configuration modules -----------------------------------
source = conf/monitors.conf
source = conf/input.conf
source = conf/appearance.conf
source = conf/animations.conf
source = conf/binds.conf
source = conf/windowrules.conf
source = conf/workspaces.conf
source = conf/autostart.conf