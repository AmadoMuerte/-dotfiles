# ============================================================
#  hypridle — idle behavior (conservative)
#  Fullscreen windows (games/video) inhibit idle automatically
#  (see windowrules.conf: idleinhibit fullscreen).
# ============================================================
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 15 minutes without input
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn screens off after 30 minutes (locked)
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
}