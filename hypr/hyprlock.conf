# ============================================================
#  hyprlock — lock screen
#  Bind: SUPER + L    Idle: hypridle
# ============================================================
general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    no_fade_in = true
}

background {
    monitor =
    color = rgba(16, 20, 23, 1)
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = JetBrains Mono
    font_size = 88
    color = rgba(223, 227, 232, 1)
    position = 0, 140
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.4
    outer_color = rgba(148, 205, 247, 1)
    inner_color = rgba(16, 20, 23, 1)
    font_color = rgba(223, 227, 232, 1)
    fail_color = rgba(255, 180, 171, 1)
    check_color = rgba(148, 205, 247, 1)
    placeholder_text = Unlock
    position = 0, -80
    halign = center
    valign = center
}