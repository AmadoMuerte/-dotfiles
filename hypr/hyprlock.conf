# Generated by desktop.theme.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0f1113ff)
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Terminus
    font_size = 64
    color = rgba(d6d6d6ff)
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = Terminus
    font_size = 16
    color = rgba(8b949eff)
    position = 0, 42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 34
    outline_thickness = 1
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.3
    outer_color = rgba(3d444dff)
    inner_color = rgba(171a1dff)
    font_color = rgba(d6d6d6ff)
    fail_color = rgba(c06060ff)
    check_color = rgba(5f9ea0ff)
    placeholder_text = password:
    position = 0, -35
    halign = center
    valign = center
}
